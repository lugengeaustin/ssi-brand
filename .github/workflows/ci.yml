name: CI

on:
  push:
    branches: [main, calm-studio-v1]
  pull_request:

jobs:
  brand-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The brand package defines the palette, so it lints its own src to prove
      # no stray off-brand values slipped into the component/export files.
      - run: node scripts/brand-lint.mjs src
